; ---------------------------------------------------------------------------
; PlatformIO project definition - STM32 ECG acquisition node
;
;   env:bluepill   real target, STM32F103C8T6 + ST-Link
;   env:blackpill  pin-compatible upgrade path (STM32F411CE, Cortex-M4F)
;   env:native     host build of the same sources, used for `pio test -e native`
;
; Only env:bluepill is the shipped hardware configuration.  env:native exists so
; that the identical translation units can be exercised on a PC without a board;
; the Makefile is the primary, dependency-free way of running the test suite.
; ---------------------------------------------------------------------------

[platformio]
default_envs = bluepill
src_dir = src
test_dir = test
include_dir = include

[ecg_common]
build_flags =
    -std=c99
    -Wall
    -Wextra
    -Iinclude
    -Ihal
    -DECG_TARGET_BUILD=1

; ---------------------------------------------------------------------------
; Real hardware: STM32F103C8T6, 72 MHz, 12-bit ADC1 + DMA1 channel 1, USART1
; ---------------------------------------------------------------------------
[env:bluepill]
platform      = ststm32
board         = bluepill_f103c8
framework     = stm32cube
build_flags   = ${ecg_common.build_flags}
                -O2
                -mcpu=cortex-m3
                -mthumb
                -DHSE_VALUE=8000000
                -DECG_MCU_STM32F103=1
build_src_filter =
    +<*>
    -<hal/hal_stub.c>
build_unflags = -std=gnu11
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 460800
monitor_filters = direct

; ---------------------------------------------------------------------------
; Optional upgrade path: Cortex-M4F with hardware single precision.
; Enable it by adding -DECG_USE_SINGLE_PRECISION to build_flags.
; ---------------------------------------------------------------------------
[env:blackpill]
platform      = ststm32
board         = blackpill_f411ce
framework     = stm32cube
build_flags   = ${ecg_common.build_flags}
                -O2
                -mcpu=cortex-m4
                -mthumb
                -mfpu=fpv4-sp-d16
                -mfloat-abi=hard
                -DECG_MCU_STM32F411=1
build_src_filter =
    +<*>
    -<hal/hal_stub.c>
upload_protocol = stlink
monitor_speed   = 460800

; ---------------------------------------------------------------------------
; Host build: same src/, the PC simulation stub and the unit tests
; ---------------------------------------------------------------------------
[env:native]
platform      = native
build_flags   = ${ecg_common.build_flags}
                -O2
                -DECG_HAVE_PTHREAD
build_src_filter =
    +<*>
test_build_src = true
